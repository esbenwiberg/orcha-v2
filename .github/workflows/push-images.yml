name: Push Images

on:
  workflow_run:
    workflows: ['CI']
    types: ['completed']
    branches: ['main']

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    if: github.event.workflow_run.conclusion == 'success'

    permissions:
      contents: read
      id-token: write

    env:
      DOCKER_BUILDKIT: '1'

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Extract short SHA
        run: echo "GIT_SHA=$(echo ${{ github.event.workflow_run.head_sha }} | cut -c1-8)" >> $GITHUB_ENV

      - name: Log in to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Log in to ACR
        run: az acr login --name ${{ secrets.ACR_NAME }}

      - name: Build orcha image
        run: |
          docker build \
            -t ${{ secrets.ACR_NAME }}.azurecr.io/orcha:${{ env.GIT_SHA }} \
            -t ${{ secrets.ACR_NAME }}.azurecr.io/orcha:latest \
            .

      - name: Push orcha image
        run: |
          docker push ${{ secrets.ACR_NAME }}.azurecr.io/orcha:${{ env.GIT_SHA }}
          docker push ${{ secrets.ACR_NAME }}.azurecr.io/orcha:latest

      - name: Build caddy image
        run: |
          docker build \
            -t ${{ secrets.ACR_NAME }}.azurecr.io/orcha-caddy:${{ env.GIT_SHA }} \
            -t ${{ secrets.ACR_NAME }}.azurecr.io/orcha-caddy:latest \
            ./caddy

      - name: Push caddy image
        run: |
          docker push ${{ secrets.ACR_NAME }}.azurecr.io/orcha-caddy:${{ env.GIT_SHA }}
          docker push ${{ secrets.ACR_NAME }}.azurecr.io/orcha-caddy:latest

      - name: Output image tag
        id: image_tag
        run: echo "image_tag=${{ env.GIT_SHA }}" >> $GITHUB_OUTPUT
