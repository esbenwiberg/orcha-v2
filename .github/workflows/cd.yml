name: CD

on:
  workflow_run:
    workflows: ['Push Images']
    types: ['completed']

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: github.event.workflow_run.conclusion == 'success'

    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - name: Log in to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Extract image tag
        run: echo "IMAGE_TAG=$(echo ${{ github.event.workflow_run.head_sha }} | cut -c1-8)" >> $GITHUB_ENV

      - name: Update container app
        run: |
          az containerapp update \
            --name ${{ secrets.CONTAINER_APP_NAME }} \
            --resource-group ${{ secrets.AZURE_RESOURCE_GROUP }} \
            --container-name orcha \
            --image ${{ secrets.ACR_NAME }}.azurecr.io/orcha:${{ env.IMAGE_TAG }}

      - name: Wait for revision to be provisioned
        run: |
          for i in $(seq 1 10); do
            STATE=$(az containerapp revision list \
              --name ${{ secrets.CONTAINER_APP_NAME }} \
              --resource-group ${{ secrets.AZURE_RESOURCE_GROUP }} \
              --query "[0].properties.provisioningState" -o tsv)
            if [ "$STATE" = "Provisioned" ]; then exit 0; fi
            if [ "$STATE" = "Failed" ]; then echo "Revision failed" && exit 1; fi
            echo "State: $STATE — waiting 15s..."
            sleep 15
          done
          echo "Timed out waiting for revision" && exit 1

      - name: Health check gate
        run: |
          curl --retry 5 --retry-delay 5 --retry-connrefused \
            -f https://${{ secrets.ORCHA_DOMAIN }}/health

      - name: Post deployment status
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const conclusion = '${{ job.status }}' === 'success' ? 'success' : 'failure';
            const appUrl = 'https://${{ secrets.ORCHA_DOMAIN }}';
            await github.rest.repos.createDeploymentStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              deployment_id: (await github.rest.repos.createDeployment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                ref: '${{ github.event.workflow_run.head_sha }}',
                environment: 'production',
                auto_merge: false,
                required_contexts: [],
              })).data.id,
              state: conclusion,
              environment_url: appUrl,
              log_url: appUrl,
            });
