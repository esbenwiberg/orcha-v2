version: '3.9'

services:
  orcha:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    volumes:
      - orcha_data:/data
    environment:
      - DATA_PATH=/data
      - NODE_ENV=production
    restart: unless-stopped
    networks:
      - internal

  caddy:
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - orcha
    networks:
      - internal
    restart: unless-stopped

volumes:
  orcha_data: {}
  caddy_data: {}
  caddy_config: {}

networks:
  internal:
    driver: bridge
