#cloud-config
# Installs Docker CE on Ubuntu 22.04.
# TLS configuration is handled post-provision by deploy-docker-vm.sh
# because we need to generate and upload certs after the VM is reachable.

package_update: true
package_upgrade: true

packages:
  - ca-certificates
  - curl
  - gnupg
  - lsb-release
  - jq

runcmd:
  # Add Docker's official GPG key and repo
  - install -m 0755 -d /etc/apt/keyrings
  - curl -fsSL https://download.docker.com/linux/ubuntu/gpg -o /etc/apt/keyrings/docker.asc
  - chmod a+r /etc/apt/keyrings/docker.asc
  - |
    echo "deb [arch=$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/docker.asc] \
    https://download.docker.com/linux/ubuntu $(lsb_release -cs) stable" \
    > /etc/apt/sources.list.d/docker.list
  - apt-get update
  - apt-get install -y docker-ce docker-ce-cli containerd.io docker-compose-plugin

  # Enable and start Docker (plain socket for now — TLS configured by deploy script)
  - systemctl enable docker
  - systemctl start docker

  # Pre-pull common base images to speed up first validation
  - docker pull node:22-slim &
  - docker pull postgres:16-alpine &
  - wait

  # Create the TLS cert directory (deploy script will populate it)
  - mkdir -p /etc/docker/tls
  - chmod 700 /etc/docker/tls

  # Signal that cloud-init is done
  - touch /var/lib/cloud/instance/boot-finished-docker
