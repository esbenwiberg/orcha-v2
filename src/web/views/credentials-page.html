<div class="page-section">
  <div class="page-section__header">
    <div>
      <h2 class="page-section__title">Profiles</h2>
      <p class="page-section__subtitle">Credential templates provisioned per session</p>
    </div>
  </div>
  <div id="credential-profiles-slot"
    hx-get="/api/credential-profiles"
    hx-trigger="load, refresh"
    hx-swap="innerHTML"
  >
    <div class="skeleton skeleton-row"></div>
    <div class="skeleton skeleton-row" style="margin-top:0.5rem"></div>
  </div>
</div>

<div class="page-section" style="margin-top:1.5rem">
  <div class="page-section__header">
    <div>
      <h2 class="page-section__title">Active Credentials</h2>
      <p class="page-section__subtitle">Live credentials provisioned for running sessions</p>
    </div>
    <button
      class="btn btn-ghost btn-sm"
      hx-post="/api/credentials/revoke-expired"
      hx-target="#active-credentials-slot"
      hx-swap="innerHTML"
      hx-confirm="Revoke all expired credentials?"
    >Revoke expired</button>
  </div>
  <div id="active-credentials-slot"
    hx-get="/api/credentials/active"
    hx-trigger="load"
    hx-swap="innerHTML"
  >
    <div class="skeleton skeleton-row"></div>
  </div>
</div>
