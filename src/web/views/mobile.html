<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title><%= it.title ?? 'Orcha' %></title>
    <link rel="stylesheet" href="/css/styles.css" />
    <link rel="stylesheet" href="/vendor/xterm.css" />
    <script src="/vendor/htmx.min.js" defer></script>
    <script src="/vendor/htmx-ext-sse.js" defer></script>
    <script>if(!(window.SpeechRecognition||window.webkitSpeechRecognition))document.documentElement.classList.add('no-speech-api')</script>
    <script src="/vendor/xterm.js" defer></script>
    <script src="/vendor/addon-fit.js" defer></script>
    <script src="/vendor/addon-web-links.js" defer></script>
    <script src="/js/mobile-terminal.js" defer></script>
    <script src="/js/file-browser.js" defer></script>
  </head>
  <body>
    <div id="mobile-shell">
      <!-- Mobile header -->
      <header id="mobile-header">
        <a href="/" class="mobile-header__logo">
          <svg
            width="20"
            height="20"
            viewBox="0 0 22 22"
            fill="none"
            aria-hidden="true"
            xmlns="http://www.w3.org/2000/svg"
          >
            <rect width="22" height="22" rx="5" fill="var(--color-accent)" />
            <path
              d="M5 8l3 3-3 3M11 15h6"
              stroke="#fff"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            />
          </svg>
          Orcha
        </a>
        <span class="mobile-header__title"><%= it.pageTitle ?? 'Sessions' %></span>
        <button id="notify-toggle" class="header-toggle" aria-label="Toggle notifications" title="Notifications" onclick="window._toggleNotifications()">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/>
            <path d="M13.73 21a2 2 0 0 1-3.46 0"/>
          </svg>
        </button>
        <button id="wakelock-toggle" class="header-toggle" aria-label="Toggle screen wake lock" title="Keep screen on" onclick="window._toggleWakeLock()">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="5"/>
            <line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/>
            <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/>
            <line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/>
            <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/>
          </svg>
        </button>
        <span id="conn-badge" class="conn-badge conn-disconnected" aria-live="polite">&#9679;&nbsp;Disconnected</span>
      </header>

      <!-- Terminal area — two layers: terminal persists, content swaps -->
      <main id="mobile-terminal-area" aria-label="Terminal area">
        <div id="mobile-terminal-layer" style="display:none"></div>
        <div id="mobile-content-layer">
          <div id="mobile-content-slot">
            <p class="mobile-placeholder-text">Select a session to begin</p>
          </div>
        </div>
      </main>

      <!-- Bottom tab bar -->
      <nav id="mobile-tabs" aria-label="Mobile navigation">
        <button
          class="mobile-tab<%= it.activeTab === 'sessions' ? ' mobile-tab--active' : '' %>"
          aria-label="Sessions"
          data-tab="sessions"
          hx-get="/mobile/sessions"
          hx-target="#mobile-content-layer"
          hx-swap="innerHTML"
          hx-trigger="load, click"
          onclick="window._showContentLayer()"
        >
          <svg
            class="mobile-tab__icon"
            width="22"
            height="22"
            viewBox="0 0 16 16"
            fill="none"
            aria-hidden="true"
            xmlns="http://www.w3.org/2000/svg"
          >
            <rect x="1" y="1" width="6" height="6" rx="1.5" stroke="currentColor" stroke-width="1.5" />
            <rect x="9" y="1" width="6" height="6" rx="1.5" stroke="currentColor" stroke-width="1.5" />
            <rect x="1" y="9" width="6" height="6" rx="1.5" stroke="currentColor" stroke-width="1.5" />
            <rect x="9" y="9" width="6" height="6" rx="1.5" stroke="currentColor" stroke-width="1.5" />
          </svg>
          <span class="mobile-tab__label">Sessions</span>
        </button>

        <button
          class="mobile-tab<%= it.activeTab === 'terminal' ? ' mobile-tab--active' : '' %>"
          aria-label="Terminal"
          data-tab="terminal"
          onclick="window._switchToTerminal()"
        >
          <svg
            class="mobile-tab__icon"
            width="22"
            height="22"
            viewBox="0 0 24 24"
            fill="none"
            aria-hidden="true"
            xmlns="http://www.w3.org/2000/svg"
          >
            <polyline points="4 17 10 11 4 5" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
            <line x1="12" y1="19" x2="20" y2="19" stroke="currentColor" stroke-width="2" stroke-linecap="round" />
          </svg>
          <span class="mobile-tab__label">Terminal</span>
        </button>

        <button
          class="mobile-tab"
          aria-label="Diff"
          data-tab="diff"
          onclick="window._switchToDiff()"
        >
          <svg
            class="mobile-tab__icon"
            width="22"
            height="22"
            viewBox="0 0 24 24"
            fill="none"
            aria-hidden="true"
            xmlns="http://www.w3.org/2000/svg"
          >
            <line x1="6" y1="3" x2="6" y2="15" stroke="currentColor" stroke-width="2" stroke-linecap="round" />
            <circle cx="18" cy="6" r="3" stroke="currentColor" stroke-width="2" />
            <circle cx="6" cy="18" r="3" stroke="currentColor" stroke-width="2" />
            <path d="M18 9a9 9 0 0 1-9 9" stroke="currentColor" stroke-width="2" stroke-linecap="round" />
          </svg>
          <span class="mobile-tab__label">Diff</span>
        </button>

        <button
          class="mobile-tab<%= it.activeTab === 'info' ? ' mobile-tab--active' : '' %>"
          aria-label="Session info"
          data-tab="info"
          hx-get="/mobile/session-info"
          hx-target="#mobile-content-layer"
          hx-swap="innerHTML"
          hx-trigger="click"
          onclick="window._showContentLayer()"
        >
          <svg
            class="mobile-tab__icon"
            width="22"
            height="22"
            viewBox="0 0 24 24"
            fill="none"
            aria-hidden="true"
            xmlns="http://www.w3.org/2000/svg"
          >
            <circle cx="12" cy="12" r="10" stroke="currentColor" stroke-width="2" />
            <line x1="12" y1="8" x2="12" y2="8" stroke="currentColor" stroke-width="2" stroke-linecap="round" />
            <line x1="12" y1="12" x2="12" y2="16" stroke="currentColor" stroke-width="2" stroke-linecap="round" />
          </svg>
          <span class="mobile-tab__label">Info</span>
        </button>
      </nav>
    </div>
    <div id="toast-container"></div>

    <!-- Slide-in form panel (shared with web) -->
    <div id="form-panel" class="form-panel">
      <div class="form-panel__header">
        <button
          class="form-panel__close"
          onclick="document.getElementById('form-panel').classList.remove('is-open')"
          aria-label="Close panel"
        >
          <svg width="14" height="14" viewBox="0 0 14 14" fill="none" aria-hidden="true">
            <path d="M2 2l10 10M12 2L2 12" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
          </svg>
        </button>
      </div>
      <div id="form-panel-slot"></div>
    </div>

    <script>
      document.body.addEventListener('close-panel', function () {
        document.getElementById('form-panel').classList.remove('is-open');
      });
      // Inject a hidden _from=mobile field into any form loaded into the form panel,
      // so the server knows to redirect back to /mobile after session creation.
      new MutationObserver(function () {
        var slot = document.getElementById('form-panel-slot');
        if (!slot) return;
        slot.querySelectorAll('form').forEach(function (form) {
          if (form.querySelector('input[name="_from"]')) return;
          var input = document.createElement('input');
          input.type = 'hidden';
          input.name = '_from';
          input.value = 'mobile';
          form.appendChild(input);
        });
      }).observe(document.getElementById('form-panel-slot'), { childList: true, subtree: true });
    </script>
  </body>
</html>
