<div class="terminal-filter-bar" id="terminal-filter-bar">
  <button class="terminal-filter-chip terminal-filter-chip--all"
    style="margin-left:auto"
    onclick="document.getElementById('session-grid').classList.toggle('compact-cards');this.textContent=this.textContent==='Compact'?'Expanded':'Compact'"
  >Compact</button>
</div>
<div
  class="session-grid"
  id="session-grid"
  hx-get="/api/sessions/cards"
  hx-trigger="load"
  hx-swap="innerHTML"
>
  <!-- Loading skeleton shown until HTMX replaces innerHTML -->
  <div class="skeleton skeleton-card"></div>
  <div class="skeleton skeleton-card"></div>
  <div class="skeleton skeleton-card"></div>
</div>
