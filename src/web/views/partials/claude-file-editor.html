<div id="claude-file-<%= it.key %>">
  <form
    hx-post="/api/claude-files/<%= it.key %>"
    hx-target="#claude-file-<%= it.key %>"
    hx-swap="outerHTML"
  >
    <textarea
      name="content"
      class="form-textarea w-full font-mono text-[13px] leading-normal whitespace-pre"
      style="min-height:12rem;tab-size:2"
      placeholder="Paste your <%= it.filename %> content here..."
    ><%= it.content %></textarea>
    <div class="flex items-center gap-3 mt-3">
      <button class="btn btn-primary btn-sm">Save</button>
      <% if (it.saved) { %>
        <span class="badge badge-success">Saved</span>
      <% } %>
      <% if (!it.content) { %>
        <span class="text-xs text-muted">Empty — file will not be written to sessions</span>
      <% } %>
    </div>
  </form>
</div>
