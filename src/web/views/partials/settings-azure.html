<div class="flex flex-col gap-3">
  <div>
    <% if (it.account) { %>
    <div class="flex items-center gap-2">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#22c55e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
      <div>
        <span class="text-sm font-medium text-slate-50"><%= it.account.name %></span>
        <% if (it.account.subscription) { %>
        <span class="text-xs text-slate-500 block"><%= it.account.subscription %></span>
        <% } %>
      </div>
    </div>
    <% } else { %>
    <div class="flex items-center gap-2 text-slate-500">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="15" y1="9" x2="9" y2="15"/><line x1="9" y1="9" x2="15" y2="15"/></svg>
      <span>Not signed in</span>
    </div>
    <% } %>
  </div>
  <div>
    <button
      type="button"
      class="btn btn-sm"
      hx-post="/api/az-login/host"
      hx-target="#az-login-host-slot"
      hx-swap="innerHTML"
    ><%= it.account ? 'Re-sign In' : 'Sign In' %></button>
  </div>
  <div id="az-login-host-slot"></div>
</div>
