<div id="send-modal" class="send-modal" role="dialog" aria-modal="true" aria-label="Send command">
  <div class="send-modal-backdrop"></div>
  <div class="send-modal-sheet">
    <label class="send-label" for="send-input">Send to terminal</label>
    <textarea
      id="send-input"
      name="text"
      class="send-input"
      rows="3"
      autocomplete="off"
      autocorrect="off"
      autocapitalize="off"
      spellcheck="false"
      placeholder="Type command…"
    ></textarea>
    <div class="send-modal-actions">
      <button type="button" class="send-cancel-btn">Cancel</button>
      <button
        type="button"
        class="send-submit-btn"
        hx-post="/mobile/send"
        hx-include="#send-input"
        hx-target="#send-result"
        hx-swap="innerHTML"
      >Send</button>
    </div>
    <div id="send-result" class="send-result"></div>
  </div>
</div>
