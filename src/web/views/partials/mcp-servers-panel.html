<div id="mcp-servers-panel">
  <% if (it.servers && it.servers.length > 0) { %>
    <div class="flex flex-col gap-2 mb-4">
      <% for (const srv of it.servers) { %>
        <div class="mcp-server-item">
          <span class="font-medium text-slate-200 shrink-0"><%= srv.name %></span>
          <span class="badge badge-info badge-sm shrink-0"><%= srv.type %></span>
          <code class="text-slate-500 flex-1 min-w-0 overflow-hidden text-ellipsis whitespace-nowrap">
            <%= srv.url ?? (srv.command ? srv.command + (srv.args ? ' ' + srv.args.join(' ') : '') : '') %>
          </code>
          <button
            class="btn btn-ghost btn-xs text-red-400 shrink-0"
            hx-delete="/api/mcp-servers/<%= srv.id %>"
            hx-target="#mcp-servers-panel"
            hx-swap="outerHTML"
            aria-label="Remove server"
          >&times;</button>
        </div>
      <% } %>
    </div>
  <% } else { %>
    <p class="text-xs text-slate-500 mb-4">No MCP servers configured.</p>
  <% } %>

  <div>
    <button
      class="btn btn-primary btn-sm"
      onclick="this.nextElementSibling.classList.toggle('hidden'); this.classList.toggle('hidden');"
    >+ Add Server</button>
    <form
      hx-post="/api/mcp-servers"
      hx-target="#mcp-servers-panel"
      hx-swap="outerHTML"
      class="hidden flex flex-col gap-3 max-w-[480px]"
    >
      <div class="flex gap-2">
        <input
          name="name"
          placeholder="Server name"
          class="form-input text-xs flex-1 min-w-0"
          required
        />
        <select name="type" class="form-select text-xs w-auto" required
          onchange="
            var t = this.value;
            var f = this.closest('form');
            f.querySelector('[data-fields=url]').style.display = (t === 'url' || t === 'sse' || t === 'http') ? '' : 'none';
            f.querySelector('[data-fields=command]').style.display = (t === 'stdio') ? '' : 'none';
          "
        >
          <option value="" disabled selected>Type...</option>
          <option value="url">url (streamable HTTP)</option>
          <option value="sse">sse</option>
          <option value="http">http</option>
          <option value="stdio">stdio (command)</option>
        </select>
      </div>

      <!-- URL / SSE fields -->
      <div data-fields="url" style="display:none" class="flex flex-col gap-2">
        <input name="url" placeholder="https://example.com/mcp" class="form-input text-xs" />
        <textarea name="headers" placeholder="Headers (key: value per line)" class="form-textarea text-xs" rows="2"></textarea>
      </div>

      <!-- Command fields -->
      <div data-fields="command" style="display:none" class="flex flex-col gap-2">
        <input name="command" placeholder="Command (e.g. npx)" class="form-input text-xs" />
        <textarea name="args" placeholder="Arguments (one per line)" class="form-textarea text-xs" rows="2"></textarea>
      </div>

      <div class="flex gap-2">
        <button class="btn btn-primary btn-xs">Add</button>
        <button
          type="button"
          class="btn btn-ghost btn-xs"
          onclick="this.closest('form').classList.add('hidden'); this.closest('form').previousElementSibling.classList.remove('hidden');"
        >Cancel</button>
      </div>
    </form>
  </div>
</div>
