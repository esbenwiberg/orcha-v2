<div id="git-identity-panel">
  <form
    hx-post="/api/git-identity"
    hx-target="#git-identity-panel"
    hx-swap="outerHTML"
  >
    <div class="grid grid-cols-2 gap-4 mb-4">
      <div>
        <label class="form-label" for="git-user-name">Name</label>
        <input
          id="git-user-name"
          name="name"
          type="text"
          class="form-input"
          placeholder="Your Name"
          value="<%= it.name %>"
        />
      </div>
      <div>
        <label class="form-label" for="git-user-email">Email</label>
        <input
          id="git-user-email"
          name="email"
          type="email"
          class="form-input"
          placeholder="you@example.com"
          value="<%= it.email %>"
        />
      </div>
    </div>
    <div class="flex items-center gap-3">
      <button class="btn btn-primary btn-sm">Save</button>
      <% if (it.saved) { %>
        <span class="badge badge-success badge-sm">Saved</span>
      <% } %>
    </div>
  </form>
</div>
