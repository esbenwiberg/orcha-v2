<form
  hx-post="/api/sessions"
  hx-target="#form-panel-slot"
  hx-swap="innerHTML"
  hx-on::after-request="if(event.detail.successful){ document.getElementById('form-panel').classList.remove('is-open'); }"
  style="display:flex;flex-direction:column;gap:1.25rem;"
>
  <div style="display:flex;flex-direction:column;gap:2px;">
    <h2 style="font-size:15px;font-weight:700;color:var(--color-text-primary);margin:0;letter-spacing:-0.01em;">New Session</h2>
    <p style="font-size:12px;color:var(--color-text-muted);margin:0;">Configure and launch a new agent session.</p>
  </div>

  <div class="form-group">
    <label for="ns-repo">Repository</label>
    <select id="ns-repo" name="repoId" required>
      <option value="">Select a repository…</option>
      <% if (it.repos) { for (const r of it.repos) { %>
        <option
          value="<%= r.id %>"
          <%= r.id === (it.repoId ?? '') ? 'selected' : '' %>
          <%= r.status !== 'ready' ? 'disabled' : '' %>
        ><%= r.displayName %><%= r.status !== 'ready' ? ' (' + r.status + ')' : '' %></option>
      <% } } %>
    </select>
  </div>

  <div class="form-group">
    <label for="ns-branch">Branch Name</label>
    <input
      id="ns-branch"
      type="text"
      name="branch"
      required
      placeholder="feature/my-branch"
      autocomplete="off"
      value="<%= it.branch ?? '' %>"
    />
  </div>

  <div class="form-group">
    <label for="ns-prompt">Initial Prompt</label>
    <textarea
      id="ns-prompt"
      name="prompt"
      rows="5"
      placeholder="Describe what you want the agent to do…"
      style="resize:vertical;min-height:100px;"
    ><%= it.prompt ?? '' %></textarea>
  </div>

  <div class="form-group">
    <label for="ns-cred-profile">
      Credential Profile
      <span style="color:var(--color-text-muted);font-style:italic;text-transform:none;letter-spacing:0;margin-left:4px;">(optional)</span>
    </label>
    <select id="ns-cred-profile" name="credentialProfileId">
      <option value="">None — use ambient credentials</option>
      <% if (it.credentialProfiles) { for (const p of it.credentialProfiles) { %>
        <option value="<%= p.id %>" <%= p.id === (it.credentialProfileId ?? '') ? 'selected' : '' %>><%= p.name %> (<%= p.durationHours %>h)</option>
      <% } } %>
    </select>
  </div>

  <div style="display:flex;gap:0.5rem;padding-top:0.25rem;border-top:1px solid var(--color-border);margin-top:auto;">
    <button type="submit" class="btn btn-primary" style="flex:1;" aria-busy="false"
      hx-on::before-request="this.setAttribute('aria-busy','true'); this.disabled=true;"
      hx-on::after-request="this.setAttribute('aria-busy','false'); this.disabled=false;"
    >
      <svg class="btn-icon-default" width="14" height="14" viewBox="0 0 14 14" fill="none" aria-hidden="true">
        <path d="M2 7h10M8 3l4 4-4 4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      <svg class="btn-icon-loading" width="14" height="14" viewBox="0 0 14 14" fill="none" aria-hidden="true" style="display:none;animation:spin 0.7s linear infinite;">
        <circle cx="7" cy="7" r="5" stroke="currentColor" stroke-width="1.5" stroke-dasharray="20" stroke-dashoffset="5" stroke-linecap="round"/>
      </svg>
      <span class="btn-label-default">Create Session</span>
      <span class="btn-label-loading" style="display:none;">Creating…</span>
    </button>
    <button
      type="button"
      class="btn btn-ghost"
      onclick="document.getElementById('form-panel').classList.remove('is-open')"
    >Cancel</button>
  </div>
</form>
