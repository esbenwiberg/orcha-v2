<form
  hx-post="/api/sessions"
  hx-target="#form-panel-slot"
  hx-swap="innerHTML"
  hx-on::after-request="if(event.detail.successful){ document.getElementById('form-panel').classList.remove('is-open'); }"
  style="display:flex;flex-direction:column;gap:1.25rem;"
>
  <div style="display:flex;flex-direction:column;gap:2px;">
    <h2 style="font-size:15px;font-weight:700;color:var(--color-text-primary);margin:0;letter-spacing:-0.01em;">New Session</h2>
    <p style="font-size:12px;color:var(--color-text-muted);margin:0;">Configure and launch a new agent session.</p>
  </div>

  <div class="form-group">
    <label for="ns-repo">Repository</label>
    <select
      id="ns-repo"
      name="repoId"
      required
      hx-get=""
      hx-trigger="change"
      hx-target="#ns-source-branch"
      hx-swap="innerHTML"
      hx-indicator="#ns-source-branch-loading"
      onchange="this.setAttribute('hx-get', this.value ? '/api/repos/' + this.value + '/branches' : ''); if(!this.value){ document.getElementById('ns-source-branch').innerHTML='<option value=\x22\x22>Select a repo first</option>'; } htmx.process(this);"
    >
      <option value="">Select a repository…</option>
      <% if (it.repos) { for (const r of it.repos) { %>
        <option
          value="<%= r.id %>"
          <%= r.id === (it.repoId ?? '') ? 'selected' : '' %>
          <%= r.status !== 'ready' ? 'disabled' : '' %>
        ><%= r.displayName %><%= r.status !== 'ready' ? ' (' + r.status + ')' : '' %></option>
      <% } } %>
    </select>
  </div>

  <div class="form-group">
    <label for="ns-source-branch">
      Source Branch
      <span id="ns-source-branch-loading" class="htmx-indicator" style="color:var(--color-text-muted);font-style:italic;text-transform:none;letter-spacing:0;margin-left:4px;">(loading…)</span>
    </label>
    <select id="ns-source-branch" name="sourceBranch">
      <% if (it.branches && it.branches.length > 0) { %>
        <% for (const b of it.branches) { %>
          <option value="origin/<%= b.name %>" <%= b.name === (it.defaultBranch ?? '') || ('origin/' + b.name) === (it.sourceBranch ?? '') ? 'selected' : '' %>><%= b.name %><%= b.isDefault ? ' (default)' : '' %></option>
        <% } %>
      <% } else if (it.sourceBranch && !it.sourceBranch.startsWith('origin/')) { %>
        <option value="<%= it.sourceBranch %>" selected>Fork point: <%= it.sourceBranch.slice(0, 12) %>…</option>
      <% } else { %>
        <option value="">Select a repo first</option>
      <% } %>
    </select>
  </div>

  <div class="form-group">
    <label for="ns-branch">Branch Name</label>
    <input
      id="ns-branch"
      type="text"
      name="branch"
      required
      placeholder="feature/my-branch"
      autocomplete="off"
      value="<%= it.branch ?? '' %>"
    />
  </div>

  <div class="form-group">
    <label for="ns-cred-profile">
      Credential Profile
      <span style="color:var(--color-text-muted);font-style:italic;text-transform:none;letter-spacing:0;margin-left:4px;">(optional)</span>
    </label>
    <select id="ns-cred-profile" name="credentialProfileId">
      <option value="">None — use ambient credentials</option>
      <% if (it.credentialProfiles) { for (const p of it.credentialProfiles) { %>
        <option value="<%= p.id %>" <%= p.id === (it.credentialProfileId ?? '') ? 'selected' : '' %>><%= p.name %> (<%= p.durationHours %>h)</option>
      <% } } %>
    </select>
  </div>

  <div class="form-group">
    <label for="ns-model-config">
      Model Config
      <span style="color:var(--color-text-muted);font-style:italic;text-transform:none;letter-spacing:0;margin-left:4px;">(optional)</span>
    </label>
    <select id="ns-model-config" name="modelConfigId">
      <option value="">None — use ambient config</option>
      <% if (it.modelConfigs) { for (const mc of it.modelConfigs) { %>
        <option value="<%= mc.id %>" <%= mc.id === (it.modelConfigId ?? '') ? 'selected' : '' %>><%= mc.name %> (<%= mc.provider %>)</option>
      <% } } %>
    </select>
  </div>

  <label style="display:flex;align-items:center;gap:0.625rem;cursor:pointer;user-select:none;">
    <span style="position:relative;display:inline-block;width:34px;height:20px;flex-shrink:0;">
      <input
        type="checkbox"
        name="sandbox"
        value="1"
        id="ns-sandbox"
        style="opacity:0;width:0;height:0;position:absolute;"
        <%= (it.sandbox === false) ? '' : 'checked' %>
        onchange="var t=this.parentElement.querySelector('span');t.style.background=this.checked?'var(--color-accent)':'var(--color-bg-3)';t.querySelector('span').style.transform=this.checked?'translateX(14px)':'';"
      />
      <span style="position:absolute;inset:0;border-radius:10px;background:<%= (it.sandbox === false) ? 'var(--color-bg-3)' : 'var(--color-accent)' %>;transition:background 0.15s;">
        <span style="position:absolute;left:3px;top:3px;width:14px;height:14px;border-radius:50%;background:#fff;transition:transform 0.15s;<%= (it.sandbox === false) ? '' : 'transform:translateX(14px);' %>"></span>
      </span>
    </span>
    <span style="font-size:12px;color:var(--color-text-secondary);">
      Isolate filesystem
      <span style="color:var(--color-text-muted);margin-left:2px;">(filesystem isolation)</span>
    </span>
  </label>

  <label style="display:flex;align-items:center;gap:0.625rem;cursor:pointer;user-select:none;">
    <span style="position:relative;display:inline-block;width:34px;height:20px;flex-shrink:0;">
      <input
        type="checkbox"
        name="skipPermissions"
        value="1"
        id="ns-skip-permissions"
        style="opacity:0;width:0;height:0;position:absolute;"
        <%= it.skipPermissions ? 'checked' : '' %>
        onchange="var t=this.parentElement.querySelector('span');t.style.background=this.checked?'var(--color-accent)':'var(--color-bg-3)';t.querySelector('span').style.transform=this.checked?'translateX(14px)':'';"
      />
      <span style="position:absolute;inset:0;border-radius:10px;background:<%= it.skipPermissions ? 'var(--color-accent)' : 'var(--color-bg-3)' %>;transition:background 0.15s;">
        <span style="position:absolute;left:3px;top:3px;width:14px;height:14px;border-radius:50%;background:#fff;transition:transform 0.15s;<%= it.skipPermissions ? 'transform:translateX(14px);' : '' %>"></span>
      </span>
    </span>
    <span style="font-size:12px;color:var(--color-text-secondary);">
      Skip permissions
      <span style="color:var(--color-text-muted);margin-left:2px;">(--dangerously-skip-permissions)</span>
    </span>
  </label>

  <% if (it.repoId) { %>
  <script>
    (function() {
      var repoSelect = document.getElementById('ns-repo');
      if (!repoSelect || !repoSelect.value) return;
      // Ensure hx-get is set for subsequent repo changes
      repoSelect.setAttribute('hx-get', '/api/repos/' + repoSelect.value + '/branches');
      htmx.process(repoSelect);
      // If branches weren't pre-loaded server-side, fetch them now
      var branchSelect = document.getElementById('ns-source-branch');
      if (branchSelect && branchSelect.options.length <= 1 && branchSelect.options[0].value === '') {
        htmx.ajax('GET', '/api/repos/' + repoSelect.value + '/branches', {target: branchSelect, swap: 'innerHTML'});
      }
    })();
  </script>
  <% } %>

  <div style="display:flex;gap:0.5rem;padding-top:0.25rem;border-top:1px solid var(--color-border);margin-top:auto;">
    <button type="submit" class="btn btn-primary" style="flex:1;" aria-busy="false"
      hx-on::before-request="this.setAttribute('aria-busy','true'); this.disabled=true;"
      hx-on::after-request="this.setAttribute('aria-busy','false'); this.disabled=false;"
    >
      <svg class="btn-icon-default" width="14" height="14" viewBox="0 0 14 14" fill="none" aria-hidden="true">
        <path d="M2 7h10M8 3l4 4-4 4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      <svg class="btn-icon-loading" width="14" height="14" viewBox="0 0 14 14" fill="none" aria-hidden="true" style="display:none;animation:spin 0.7s linear infinite;">
        <circle cx="7" cy="7" r="5" stroke="currentColor" stroke-width="1.5" stroke-dasharray="20" stroke-dashoffset="5" stroke-linecap="round"/>
      </svg>
      <span class="btn-label-default">Create Session</span>
      <span class="btn-label-loading" style="display:none;">Creating…</span>
    </button>
    <button
      type="button"
      class="btn btn-ghost"
      onclick="document.getElementById('form-panel').classList.remove('is-open')"
    >Cancel</button>
  </div>
</form>
