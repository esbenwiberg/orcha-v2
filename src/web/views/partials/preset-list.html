<% if (!it.presets || it.presets.length === 0) { %>
  <div class="empty-state">
    <p>No presets yet.</p>
    <p class="text-sm text-muted mt-1">Save a preset to reuse session configurations.</p>
  </div>
<% } else { %>
  <div class="table-scroll">
    <table class="data-table" id="preset-list">
      <thead>
        <tr>
          <th>Name</th>
          <th>Repo</th>
          <th>Credentials</th>
          <th>Model</th>
          <th></th>
        </tr>
      </thead>
      <tbody>
        <% for (const p of it.presets) { %>
          <%~ include('preset-item', { preset: p }) %>
        <% } %>
      </tbody>
    </table>
  </div>
<% } %>
