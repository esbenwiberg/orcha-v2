<% if (it.credentials) { %>
<div class="cred-strip<%= it.credentials.isExpiringSoon ? ' is-expiring-soon' : '' %><%= it.credentials.isExpired ? ' is-expired' : '' %>"
     id="cred-strip-<%= it.sessionId %>">
  <span class="text-xs font-mono text-muted">&#128273; <%= it.credentials.profileName %></span>
  <span class="cred-expiry text-xs" data-expires="<%= it.credentials.expiresAt %>">
    <%= it.credentials.expiresInFormatted %>
  </span>
  <button class="btn btn-xs text-error ml-1"
    hx-post="/api/credentials/<%= it.credentials.id %>/revoke"
    hx-confirm="Revoke credentials for this session?"
    hx-target="#cred-strip-<%= it.sessionId %>"
    hx-swap="outerHTML">Revoke</button>
</div>
<% } %>
