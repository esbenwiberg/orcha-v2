<div class="file-browser-overlay" id="file-browser-overlay" onclick="if(event.target===this)window.__fileBrowserClose()">
  <div class="file-browser">
    <div class="file-browser__toolbar">
      <div class="file-browser__breadcrumb" id="fb-breadcrumb">
        <svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M2 4l2-2h4l2 2h4v10H2V4z"/></svg>
        <span id="fb-path" class="file-browser__path">Select a file...</span>
      </div>
      <div class="file-browser__toolbar-actions">
        <button class="btn btn-ghost btn-sm hidden" id="fb-edit-toggle" onclick="window.__fbToggleEdit()">Edit</button>
        <button class="btn btn-primary btn-sm hidden" id="fb-save-btn" onclick="window.__fbSave()">Save</button>
        <button class="btn btn-ghost btn-sm fb-back-btn hidden" id="fb-back-btn" onclick="window.__fbBackToTree()">Back</button>
        <button class="btn btn-ghost btn-sm" onclick="window.__fileBrowserClose()">Close</button>
      </div>
    </div>
    <div class="file-browser__body">
      <div class="file-browser__tree-pane" id="fb-tree-pane"
        hx-get="/api/sessions/<%= it.sessionId %>/files?path=.&depth=0"
        hx-trigger="load"
        hx-swap="innerHTML">
      </div>
      <div class="file-browser__editor-pane" id="fb-editor-pane">
        <div class="file-browser__editor-empty" id="fb-editor-empty">
          <svg width="48" height="48" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="0.8" opacity="0.3"><path d="M2 2h8l4 4v8a1 1 0 01-1 1H3a1 1 0 01-1-1V2z"/><path d="M9 2v4h4"/></svg>
          <p>Select a file to view</p>
        </div>
        <div class="file-browser__editor-container hidden" id="fb-editor-container"></div>
        <div class="file-browser__editor-message hidden" id="fb-editor-message"></div>
      </div>
    </div>
  </div>
</div>
<script>
(function() {
  // If file-browser.js is pre-loaded (mobile.html / layout.html), init immediately.
  // Otherwise load it dynamically and init on load.
  if (typeof window.__fileBrowserInit === 'function') {
    window.__fileBrowserInit('<%= it.sessionId %>');
  } else {
    var s = document.createElement('script');
    s.src = '/js/file-browser.js';
    s.onload = function() { window.__fileBrowserInit('<%= it.sessionId %>'); };
    document.head.appendChild(s);
  }
})();
</script>
