<li class="session-item" id="mobile-session-<%= it.sessionId %>">
  <div class="session-item-row">
    <button
      class="session-select-btn"
      hx-post="/mobile/connect/<%= it.sessionId %>"
      hx-target="#mobile-terminal-layer"
      hx-swap="innerHTML"
    >
      <span class="session-select-btn__labels">
        <span class="session-select-btn__repo"><%= it.repoName || it.branch %></span>
        <% if (it.repoName) { %>
        <span class="session-select-btn__branch"><%= it.branch %></span>
        <% } %>
      </span>
      <% const _bm = { pending:'badge-neutral', starting:'badge-warning badge-dot badge-pulse', running:'badge-success badge-dot badge-pulse', paused:'badge-accent', completed:'badge-success', failed:'badge-error', cancelled:'badge-neutral', 'needs-input':'badge-purple badge-dot badge-pulse' }; const _labels = { 'needs-input': 'human needed' }; %><span class="badge <%= _bm[it.status] || 'badge-neutral' %>" id="badge-<%= it.sessionId %>" sse-swap="session-status-<%= it.sessionId %>" hx-swap="outerHTML"><%= _labels[it.status] || it.status %></span>
    </button>
    <button
      class="session-kebab-btn"
      data-session-id="<%= it.sessionId %>"
      aria-label="Session actions"
    >&#8942;</button>
  </div>
</li>
