<li class="session-item" id="mobile-session-<%= it.sessionId %>">
  <button
    class="session-select-btn"
    hx-post="/mobile/connect/<%= it.sessionId %>"
    hx-target="#mobile-terminal-area"
    hx-swap="innerHTML"
  >
    <span class="session-select-btn__branch"><%= it.branch %></span>
    <span class="session-status-badge" data-status="<%= it.status %>"><%= it.status %></span>
  </button>
</li>
