<div class="debug-shell-panel" id="debug-shell-<%= it.shellId %>">
  <div class="debug-shell-header">
    <span class="debug-shell-label<%= it.label ? ' debug-shell-label--host' : '' %>"><%= it.label || 'Shell' %></span>
    <button class="terminal-header__btn" title="Close shell"
      hx-post="/api/sessions/<%= it.sessionId %>/debug-shell/<%= it.shellId %>/stop"
      hx-target="#debug-shell-<%= it.shellId %>"
      hx-swap="delete">
      <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
        <line x1="4" y1="4" x2="12" y2="12" /><line x1="12" y1="4" x2="4" y2="12" />
      </svg>
    </button>
  </div>
  <div class="xterm-container" id="xterm-shell-<%= it.shellId %>"></div>
</div>
<script type="module">
  import { openTerminal } from '/js/terminal.js';
  openTerminal('<%= it.shellId %>', 'xterm-shell-<%= it.shellId %>', '/ws/shell/');
</script>
