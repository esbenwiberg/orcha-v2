<div id="terminal-frame" class="terminal-frame" data-session-id="<%= it.sessionId %>" data-ws-url="<%= it.wsUrl %>">
  <div id="xterm-container" class="xterm-container"></div>
  <div class="mobile-keys" id="mobile-keys">
    <button class="mobile-key" data-key="\x1b">Esc</button>
    <button class="mobile-key" data-key="\t">Tab</button>
    <button class="mobile-key" data-key="\x03">Ctrl+C</button>
    <button class="mobile-key" data-key="\x04">Ctrl+D</button>
    <button class="mobile-key" data-key="\x1a">Ctrl+Z</button>
    <button class="mobile-key mobile-key--arrow" data-key="\x1b[A">&uarr;</button>
    <button class="mobile-key mobile-key--arrow" data-key="\x1b[B">&darr;</button>
  </div>
  <div class="swipe-hint">Swipe down to disconnect</div>
</div>
