<div id="terminal-frame" class="terminal-frame" data-session-id="<%= it.sessionId %>" data-ws-url="<%= it.wsUrl %>">
  <% if (it.modelProvider === 'max') { %>
  <div id="auth-slot-mobile-<%= it.sessionId %>"
       class="mobile-auth-slot"
       hx-get="/api/sessions/<%= it.sessionId %>/auth-url"
       hx-trigger="load, every 3s"
       hx-swap="innerHTML"></div>
  <% } %>
  <div id="xterm-container" class="xterm-container"></div>
  <div class="mobile-keys" id="mobile-keys">
    <button class="mobile-key" data-key="esc">Esc</button>
    <button class="mobile-key" data-key="tab">Tab</button>
    <button class="mobile-key" data-key="ctrl-c">Ctrl+C</button>
    <button class="mobile-key" data-key="ctrl-d">Ctrl+D</button>
    <button class="mobile-key" data-key="ctrl-z">Ctrl+Z</button>
    <button class="mobile-key mobile-key--arrow" data-key="arrow-up">&uarr;</button>
    <button class="mobile-key mobile-key--arrow" data-key="arrow-down">&darr;</button>
  </div>
  <div class="swipe-hint">Swipe down to disconnect</div>
</div>
