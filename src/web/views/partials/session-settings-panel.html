<div id="session-settings-panel">
  <form
    hx-post="/api/session-settings/max-concurrent"
    hx-target="#session-settings-panel"
    hx-swap="outerHTML"
    class="flex gap-3 items-end"
  >
    <div class="flex flex-col gap-1">
      <label class="text-xs text-muted" for="maxConcurrentSessions">Max concurrent sessions</label>
      <input
        type="number"
        id="maxConcurrentSessions"
        name="maxConcurrent"
        value="<%= it.maxConcurrent %>"
        min="1"
        max="<%= it.absoluteMax %>"
        class="form-input text-sm w-20"
      />
    </div>
    <button type="submit" class="btn btn-xs btn-primary">Save</button>
  </form>
  <small class="text-xs text-muted block mt-2">
    Maximum number of agent sessions running simultaneously. Each Claude Code process uses 200–400 MB of memory.
    Increase if you have a larger container; lower if you run memory-heavy builds (e.g. .NET).
  </small>
</div>
