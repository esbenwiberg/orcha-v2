<tr id="preset-<%= it.preset.id %>">
  <td>
    <span style="font-weight:500;color:var(--color-text-primary)"><%= it.preset.name %></span>
  </td>
  <td>
    <span class="text-xs text-muted">
      <%= it.preset.repoName ?? (it.preset.repoId ? it.preset.repoId.slice(0, 8) : '—') %>
    </span>
  </td>
  <td>
    <span class="text-xs text-muted">
      <%= it.preset.credentialProfileName ?? (it.preset.credentialProfileId ? it.preset.credentialProfileId.slice(0, 8) : '—') %>
    </span>
  </td>
  <td class="data-table__actions">
    <button
      class="btn btn-ghost btn-xs"
      hx-get="/api/presets/<%= it.preset.id %>/load"
      hx-target="#form-panel-slot"
      hx-swap="innerHTML"
      onclick="document.getElementById('form-panel').classList.add('is-open')"
    >Load</button>
    <button
      class="btn btn-ghost btn-xs"
      hx-delete="/api/presets/<%= it.preset.id %>"
      hx-target="#preset-<%= it.preset.id %>"
      hx-swap="outerHTML"
      hx-confirm="Delete preset?"
    >Delete</button>
  </td>
</tr>
