<div class="terminal-panel is-open" id="terminal-panel-<%= it.id %>">
  <div class="terminal-header" ondblclick="window.__termFullscreen('<%= it.id %>')">
    <div class="terminal-header__actions">
      <button class="terminal-header__btn" title="Docs"
        hx-get="/api/sessions/<%= it.id %>/md-browser"
        hx-target="body" hx-swap="beforeend">
        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M2 2h8l4 4v8a1 1 0 01-1 1H3a1 1 0 01-1-1V2z" /><path d="M9 2v4h4" /><path d="M5 9h6M5 12h4" />
        </svg>
      </button>
      <button class="terminal-header__btn terminal-header__btn--mic" title="Voice input" onclick="window.__termVoice('<%= it.id %>')">
        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
          <rect x="5" y="1" width="6" height="9" rx="3" /><path d="M3 7v1a5 5 0 0010 0V7" /><line x1="8" y1="13" x2="8" y2="15" /><line x1="5" y1="15" x2="11" y2="15" />
        </svg>
      </button>
      <button class="terminal-header__btn" title="Fullscreen" onclick="window.__termFullscreen('<%= it.id %>')">
        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="4 1 1 1 1 4" /><polyline points="12 1 15 1 15 4" />
          <polyline points="4 15 1 15 1 12" /><polyline points="12 15 15 15 15 12" />
        </svg>
      </button>
      <button class="terminal-header__btn" title="Close" onclick="window.__termCloseMenu('<%= it.id %>', this)">
        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
          <line x1="4" y1="4" x2="12" y2="12" /><line x1="12" y1="4" x2="4" y2="12" />
        </svg>
      </button>
    </div>
  </div>
  <div class="xterm-container" id="xterm-<%= it.id %>"></div>
</div>
<script type="module">
  import { openTerminal } from '/js/terminal.js';
  openTerminal('<%= it.id %>', 'xterm-<%= it.id %>');
</script>
