<form
  hx-post="/api/presets"
  hx-target="#form-panel-slot"
  hx-swap="innerHTML"
  hx-on::after-request="if(event.detail.successful){ document.getElementById('form-panel').classList.remove('is-open'); htmx.trigger('#preset-list-slot', 'refresh'); }"
>
  <h2 class="text-sm" style="color:var(--color-text-primary);font-weight:600;margin:0 0 0.5rem;">Save Preset</h2>

  <div class="form-group">
    <label for="sp-name">Preset Name</label>
    <input
      id="sp-name"
      type="text"
      name="name"
      required
      maxlength="64"
      placeholder="My preset"
      autocomplete="off"
      value="<%= it.name ?? '' %>"
    />
  </div>

  <div class="form-group">
    <label for="sp-repo">Repository</label>
    <select id="sp-repo" name="repoId">
      <option value="">None</option>
      <% if (it.repos) { for (const r of it.repos) { %>
        <option
          value="<%= r.id %>"
          <%= r.id === (it.repoId ?? '') ? 'selected' : '' %>
          <%= r.status !== 'ready' ? 'disabled' : '' %>
        ><%= r.displayName %><%= r.status !== 'ready' ? ' (' + r.status + ')' : '' %></option>
      <% } } %>
    </select>
  </div>

  <div class="form-group">
    <label for="sp-cred-profile">
      Credential Profile
      <span style="color:var(--color-text-muted);font-style:italic;text-transform:none;letter-spacing:0;margin-left:4px;">(optional)</span>
    </label>
    <select id="sp-cred-profile" name="credentialProfileId">
      <option value="">None</option>
      <% if (it.credentialProfiles) { for (const p of it.credentialProfiles) { %>
        <option
          value="<%= p.id %>"
          <%= p.id === (it.credentialProfileId ?? '') ? 'selected' : '' %>
        ><%= p.name %> (<%= p.durationHours %>h)</option>
      <% } } %>
    </select>
  </div>

  <div style="display:flex;gap:0.5rem;margin-top:0.5rem;">
    <button type="submit" class="btn btn-primary">Save</button>
    <button
      type="button"
      class="btn btn-ghost"
      onclick="document.getElementById('form-panel').classList.remove('is-open')"
    >Cancel</button>
  </div>
</form>
