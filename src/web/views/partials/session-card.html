<div
  class="session-card has-terminal"
  id="session-<%= it.id %>"
  hx-ext="sse"
  sse-connect="/api/events"
>
  <div class="session-card__header">
    <span class="card__meta"><%= it.branch %></span>
    <div class="session-card__header-right">
      <span class="badge badge--<%= it.status %>" id="badge-<%= it.id %>" sse-swap="session-status-<%= it.id %>" hx-swap="outerHTML"><%= it.status %></span>
      <div class="session-card__term-actions">
        <button class="terminal-header__btn" title="Docs"
          hx-get="/api/sessions/<%= it.id %>/md-browser"
          hx-target="body" hx-swap="beforeend">
          <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M2 2h8l4 4v8a1 1 0 01-1 1H3a1 1 0 01-1-1V2z" /><path d="M9 2v4h4" /><path d="M5 9h6M5 12h4" />
          </svg>
        </button>
        <button class="terminal-header__btn" title="Fullscreen" onclick="window.__termFullscreen('<%= it.id %>')">
          <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="4 1 1 1 1 4" /><polyline points="12 1 15 1 15 4" />
            <polyline points="4 15 1 15 1 12" /><polyline points="12 15 15 15 15 12" />
          </svg>
        </button>
        <button class="terminal-header__btn" title="Close" onclick="window.__termCloseMenu('<%= it.id %>', this)">
          <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
            <line x1="4" y1="4" x2="12" y2="12" /><line x1="12" y1="4" x2="4" y2="12" />
          </svg>
        </button>
      </div>
    </div>
  </div>
  <div class="session-card__body">
    <p class="card__meta">Started <%= it.createdAt %></p>
    <p class="card__meta">Updated <%= it.updatedAt %></p>
    <% if (it.modelProvider === 'max' && it.status === 'running') { %>
    <div id="auth-slot-<%= it.id %>"
         hx-get="/api/sessions/<%= it.id %>/auth-url"
         hx-trigger="load, every 3s"
         hx-swap="innerHTML"></div>
    <% } %>
    <%~ include('credential-status-strip', { sessionId: it.id, credentials: it.credentials }) %>
  </div>
  <div class="terminal-slot" id="terminal-slot-<%= it.id %>"
    hx-get="/api/sessions/<%= it.id %>/terminal"
    hx-trigger="load"
    hx-swap="innerHTML"
  ></div>
</div>
