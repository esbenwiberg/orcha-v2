<div
  class="session-card"
  id="session-<%= it.id %>"
  hx-ext="sse"
  sse-connect="/api/events"
>
  <div class="session-card__header">
    <span class="card__meta"><%= it.branch %></span>
    <span class="badge badge--<%= it.status %>" id="badge-<%= it.id %>" sse-swap="session-status-<%= it.id %>" hx-swap="outerHTML"><%= it.status %></span>
  </div>
  <div class="session-card__body">
    <p class="card__meta">Started <%= it.createdAt %></p>
    <p class="card__meta">Updated <%= it.updatedAt %></p>
    <% if (it.modelProvider === 'max' && it.status === 'running') { %>
    <div id="auth-slot-<%= it.id %>"
         hx-get="/api/sessions/<%= it.id %>/auth-url"
         hx-trigger="load, every 3s"
         hx-swap="innerHTML"></div>
    <% } %>
    <div id="confirm-slot-<%= it.id %>" style="position:relative"></div>
    <%~ include('credential-status-strip', { sessionId: it.id, credentials: it.credentials }) %>
  </div>
  <div class="session-card__footer">
    <button
      class="btn btn-ghost btn-sm"
      hx-get="/api/sessions/<%= it.id %>/terminal"
      hx-target="#terminal-slot-<%= it.id %>"
      hx-swap="innerHTML"
      onclick="this.closest('.session-card').classList.add('has-terminal')"
    >Open Terminal</button>
    <button
      class="btn btn-ghost btn-sm"
      hx-get="/api/sessions/<%= it.id %>/confirm?action=stop"
      hx-target="#confirm-slot-<%= it.id %>"
      hx-swap="innerHTML"
    >Stop</button>
    <button
      class="btn btn-ghost btn-sm"
      style="color:var(--color-error)"
      hx-get="/api/sessions/<%= it.id %>/confirm?action=kill"
      hx-target="#confirm-slot-<%= it.id %>"
      hx-swap="innerHTML"
    >Kill</button>
    <button
      class="btn btn-ghost btn-sm"
      onclick="this.closest('.session-card').classList.toggle('is-focused')"
    >Focus</button>
    <button
      class="btn btn-ghost btn-sm"
      style="color:var(--color-error)"
      hx-delete="/api/sessions/<%= it.id %>"
      hx-target="#session-<%= it.id %>"
      hx-swap="delete"
      hx-confirm="Delete this session? This cannot be undone."
    >Delete</button>
  </div>
  <div class="terminal-slot" id="terminal-slot-<%= it.id %>"></div>
</div>
