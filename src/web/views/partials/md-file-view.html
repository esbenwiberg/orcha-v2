<div data-md-path="<%= it.filePath %>">
  <div class="md-file-view markdown-body">
    <%~ it.rendered %>
  </div>
  <div class="md-file-edit" style="display:none">
    <textarea class="md-file-edit__textarea" spellcheck="false"><%= it.raw %></textarea>
  </div>
</div>
<script>
(function() {
  var label = document.getElementById('md-picker-label');
  if (label) label.textContent = '<%= it.filePath %>';
  var toggleBtn = document.getElementById('md-edit-toggle-btn');
  var saveBtn = document.getElementById('md-save-btn');
  if (toggleBtn) toggleBtn.textContent = 'Edit';
  if (saveBtn) saveBtn.style.display = 'none';
})();
</script>
