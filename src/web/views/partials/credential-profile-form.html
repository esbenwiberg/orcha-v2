<form hx-post="/api/credential-profiles"
      hx-target="#form-panel-slot"
      hx-swap="innerHTML"
      hx-on::after-request="if(event.detail.successful){ document.getElementById('form-panel').classList.remove('is-open'); htmx.trigger('#credential-profiles-slot', 'refresh'); }">

  <h2 class="text-sm" style="color:var(--color-text-primary);font-weight:600;margin:0 0 0.5rem;">New Credential Profile</h2>

  <div class="form-group">
    <label for="cp-name">Profile Name</label>
    <input id="cp-name" type="text" name="name" required placeholder="e.g. bugfix-dev" />
  </div>

  <div class="form-group">
    <label for="cp-duration">Duration (hours)</label>
    <input id="cp-duration" type="number" name="durationHours" value="4" min="1" max="72" required />
  </div>

  <details style="margin-bottom:0.75rem">
    <summary class="text-xs" style="cursor:pointer;color:var(--color-text-muted)">Azure (optional)</summary>
    <div style="padding:0.5rem 0 0 0.5rem">
      <div class="form-group">
        <label for="cp-az-sub">Subscription ID</label>
        <input id="cp-az-sub" type="text" name="azureSubscriptionId" placeholder="xxxxxxxx-xxxx-xxxx-xxxx-xxxxxxxxxxxx" />
      </div>
      <div class="form-group">
        <label for="cp-az-rgs">Resource Groups (comma-separated)</label>
        <input id="cp-az-rgs" type="text" name="azureResourceGroups" placeholder="myapp-dev-rg, myapp-test-rg" />
      </div>
      <div class="form-group">
        <label for="cp-az-role">Role</label>
        <select id="cp-az-role" name="azureRole">
          <option value="Contributor">Contributor</option>
          <option value="Reader">Reader</option>
          <option value="Owner">Owner</option>
        </select>
      </div>
    </div>
  </details>

  <details style="margin-bottom:0.75rem">
    <summary class="text-xs" style="cursor:pointer;color:var(--color-text-muted)">GitHub (optional)</summary>
    <div style="padding:0.5rem 0 0 0.5rem">
      <div class="form-group">
        <label for="cp-gh-repos">Repos (comma-separated, owner/repo)</label>
        <input id="cp-gh-repos" type="text" name="githubRepos" placeholder="myorg/myapp, myorg/mylib" />
      </div>
      <div class="form-group">
        <label for="cp-gh-perms">Permissions (comma-separated)</label>
        <input id="cp-gh-perms" type="text" name="githubPermissions" placeholder="contents:write, pull_requests:write" />
      </div>
    </div>
  </details>

  <details style="margin-bottom:0.75rem">
    <summary class="text-xs" style="cursor:pointer;color:var(--color-text-muted)">Azure DevOps (optional)</summary>
    <div style="padding:0.5rem 0 0 0.5rem">
      <div class="form-group">
        <label for="cp-ado-org">Org URL</label>
        <input id="cp-ado-org" type="text" name="devopsOrg" placeholder="https://dev.azure.com/myorg" />
      </div>
      <div class="form-group">
        <label for="cp-ado-proj">Project</label>
        <input id="cp-ado-proj" type="text" name="devopsProject" placeholder="myproject" />
      </div>
      <div class="form-group">
        <label for="cp-ado-scopes">Scopes (comma-separated)</label>
        <input id="cp-ado-scopes" type="text" name="devopsScopes" placeholder="vso.code_write, vso.work_write" />
      </div>
    </div>
  </details>

  <div style="display:flex;gap:0.5rem;margin-top:0.5rem;">
    <button type="submit" class="btn btn-primary">Create Profile</button>
    <button type="button" class="btn btn-ghost"
      onclick="document.getElementById('form-panel').classList.remove('is-open')">Cancel</button>
  </div>
</form>
