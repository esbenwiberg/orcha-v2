<div id="skills-panel">
  <div class="max-w-[640px]">
    <div class="flex items-center gap-3 mb-3">
      <h3 class="text-sm m-0"><%= it.isNew ? 'New' : 'Edit' %> Skill: <code>/<%= it.skill.name %></code></h3>
      <button
        class="btn btn-xs"
        hx-get="/api/skills"
        hx-target="#skills-panel"
        hx-swap="outerHTML"
      >Cancel</button>
    </div>
    <form
      hx-post="/api/skills"
      hx-target="#skills-panel"
      hx-swap="outerHTML"
      class="flex flex-col gap-2"
    >
      <input type="hidden" name="name" value="<%= it.skill.name %>" />
      <textarea
        name="content"
        class="form-textarea font-mono text-[13px] leading-normal whitespace-pre"
        style="min-height:18rem;tab-size:2"
        placeholder="---
name: <%= it.skill.name %>
description: What this skill does
---

Instructions..."
        required
      ><%= it.skill.content %></textarea>
      <div>
        <button class="btn btn-xs btn-primary">Save</button>
      </div>
    </form>
  </div>
</div>
