<div class="file-tree" data-dir="<%= it.dirPath %>">
  <% for (const entry of it.entries) { %>
  <% const entryPath = it.dirPath === '.' ? entry.name : it.dirPath + '/' + entry.name; %>
  <% if (entry.isDirectory) { %>
  <div class="file-tree__folder" data-path="<%= entryPath %>">
    <button
      class="file-tree__entry file-tree__entry--dir"
      style="padding-left: <%= 8 + it.depth * 16 %>px"
      onclick="window.__fbToggleFolder(this)"
      data-path="<%= entryPath %>"
      data-depth="<%= it.depth %>"
      data-session="<%= it.sessionId %>"
    >
      <svg class="file-tree__icon file-tree__icon--closed" width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M6 4l4 4-4 4"/></svg>
      <svg class="file-tree__icon file-tree__icon--open" width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6l4 4 4-4"/></svg>
      <svg class="file-tree__icon file-tree__folder-icon" width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M2 4l2-2h4l2 2h4v10H2V4z"/></svg>
      <span class="file-tree__name"><%= entry.name %></span>
    </button>
    <div class="file-tree__children hidden"></div>
  </div>
  <% } else { %>
  <button
    class="file-tree__entry file-tree__entry--file"
    style="padding-left: <%= 8 + it.depth * 16 %>px"
    onclick="window.__fbOpenFile(this)"
    data-path="<%= entryPath %>"
    data-session="<%= it.sessionId %>"
  >
    <svg class="file-tree__icon" width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M3 1h7l3 3v10a1 1 0 01-1 1H3a1 1 0 01-1-1V2a1 1 0 011-1z"/><path d="M10 1v3h3"/></svg>
    <span class="file-tree__name"><%= entry.name %></span>
    <span class="file-tree__size"><%= entry.size > 1048576 ? (entry.size / 1048576).toFixed(1) + 'M' : entry.size > 1024 ? (entry.size / 1024).toFixed(0) + 'K' : entry.size + 'B' %></span>
  </button>
  <% } %>
  <% } %>
  <% if (it.entries.length === 0) { %>
  <div class="file-tree__empty" style="padding-left: <%= 8 + it.depth * 16 %>px">Empty directory</div>
  <% } %>
</div>
