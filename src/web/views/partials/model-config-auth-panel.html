<div id="model-config-auth-panel-<%= it.id %>">
  <h2 class="text-sm" style="color:var(--color-text-primary);font-weight:600;margin:0 0 1rem;">Authenticate with Claude Max</h2>

  <ol style="margin:0 0 1.25rem;padding-left:1.25rem;display:flex;flex-direction:column;gap:0.5rem;">
    <li class="text-sm">Run <code style="background:var(--color-bg-secondary);padding:0.1em 0.4em;border-radius:3px;font-size:0.85em;">claude auth login</code> on any machine with Claude Code installed.</li>
    <li class="text-sm">Open <code style="background:var(--color-bg-secondary);padding:0.1em 0.4em;border-radius:3px;font-size:0.85em;">~/.claude/.credentials.json</code> and copy its full contents.</li>
    <li class="text-sm">Paste the JSON below and click <strong>Save</strong>.</li>
  </ol>

  <form
    hx-post="/api/model-configs/<%= it.id %>/auth/save"
    hx-target="#model-config-auth-panel-<%= it.id %>"
    hx-swap="outerHTML"
  >
    <div class="form-group" style="margin-bottom:1rem;">
      <label class="form-label" for="auth-credentials-json-<%= it.id %>">credentials.json</label>
      <textarea
        id="auth-credentials-json-<%= it.id %>"
        name="credentialsJson"
        class="form-input"
        rows="8"
        placeholder='{"claudeAiOauth":{"accessToken":"...","refreshToken":"...",...}}'
        required
        style="font-family:var(--font-mono);font-size:0.75rem;resize:vertical;"
      ></textarea>
    </div>

    <div style="display:flex;gap:0.5rem;">
      <button type="submit" class="btn btn-primary btn-sm">Save</button>
      <button
        type="button"
        class="btn btn-ghost btn-sm"
        onclick="document.getElementById('form-panel').classList.remove('is-open')"
      >Cancel</button>
    </div>
  </form>
</div>
