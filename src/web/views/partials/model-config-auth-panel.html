<div id="model-config-auth-panel-<%= it.id %>">
  <h2 class="text-sm" style="color:var(--color-text-primary);font-weight:600;margin:0 0 0.5rem;">Authenticate with Claude Max</h2>
  <p class="text-xs text-muted" style="margin:0 0 1rem;">
    A login URL will appear in the terminal below. Open it in your browser to sign in with your claude.ai account.
    Credentials will be saved automatically once you've logged in.
  </p>

  <!-- Auth terminal -->
  <div style="background:#000;border-radius:var(--radius-card);overflow:hidden;height:300px;margin-bottom:1rem;">
    <div id="xterm-auth-<%= it.id %>" style="width:100%;height:100%;"></div>
  </div>

  <!-- Status indicator — polls every 2s until credentials appear -->
  <div id="auth-status-indicator"
       hx-get="/api/model-configs/<%= it.id %>/auth/status?token=<%= it.token %>"
       hx-trigger="every 2s"
       hx-swap="outerHTML"
       style="margin-bottom:0.75rem;">
    <span class="badge badge--paused">Waiting for login…</span>
  </div>

  <button
    class="btn btn-ghost btn-sm"
    hx-delete="/api/model-configs/<%= it.id %>/auth/stop?token=<%= it.token %>"
    hx-swap="none"
    onclick="document.getElementById('form-panel').classList.remove('is-open')"
  >Cancel</button>
</div>

<script type="module">
  (async function () {
    const container = document.getElementById('xterm-auth-<%= it.id %>');
    if (!container) return;

    const term = new window.Terminal({
      fontSize: 13,
      fontFamily: getComputedStyle(document.documentElement).getPropertyValue('--font-mono').trim() ||
        'ui-monospace, SFMono-Regular, Menlo, Consolas, monospace',
      theme: { background: '#000000', foreground: '#e2e8f0', cursor: '#2563eb' },
      cursorBlink: true,
    });

    const fitAddon = new window.FitAddon.FitAddon();
    term.loadAddon(fitAddon);
    term.open(container);
    fitAddon.fit();

    // Fetch one-time WS ticket for OIDC mode (no-op otherwise)
    let ticket = '';
    try {
      const r = await fetch('/api/ws-ticket');
      if (r.ok) { const d = await r.json(); ticket = typeof d.ticket === 'string' ? d.ticket : ''; }
    } catch { /* proceed without ticket */ }

    const proto = location.protocol === 'https:' ? 'wss:' : 'ws:';
    const wsUrl = ticket
      ? `${proto}//${location.host}/ws/auth/<%= it.token %>?ticket=${ticket}`
      : `${proto}//${location.host}/ws/auth/<%= it.token %>`;
    const ws = new WebSocket(wsUrl);

    ws.onmessage = (event) => {
      try {
        const msg = JSON.parse(event.data);
        if (msg.type === 'output' && typeof msg.data === 'string') term.write(msg.data);
        else if (msg.type === 'error') term.write(`\r\n\x1b[31m[error] ${msg.message}\x1b[0m\r\n`);
      } catch { /* ignore */ }
    };
    ws.onerror = () => term.write('\r\n\x1b[31m[terminal] WebSocket connection failed\x1b[0m\r\n');
    ws.onclose = (e) => {
      if (e.code !== 1000 && e.code !== 1001)
        term.write(`\r\n\x1b[33m[terminal] Connection closed (${e.code})\x1b[0m\r\n`);
    };

    term.onData((data) => { if (ws.readyState === WebSocket.OPEN) ws.send(JSON.stringify({ type: 'input', data })); });

    const observer = new ResizeObserver(() => {
      fitAddon.fit();
      if (ws.readyState === WebSocket.OPEN) {
        const dims = fitAddon.proposeDimensions();
        if (dims) ws.send(JSON.stringify({ type: 'resize', cols: dims.cols, rows: dims.rows }));
      }
    });
    observer.observe(container);

    document.getElementById('form-panel')?.addEventListener('transitionend', function onClose() {
      if (!document.getElementById('form-panel').classList.contains('is-open')) {
        ws.close(); term.dispose(); observer.disconnect();
        document.getElementById('form-panel').removeEventListener('transitionend', onClose);
      }
    });
  })();
</script>
