<div id="model-config-auth-panel-<%= it.id %>">
  <h2 class="text-sm" style="color:var(--color-text-primary);font-weight:600;margin:0 0 0.5rem;">Authenticate with Claude Max</h2>
  <p class="text-xs text-muted" style="margin:0 0 1rem;">
    Claude will open in the terminal below. Follow the prompts to log in with your claude.ai account.
    Once authenticated, credentials will be saved automatically.
  </p>

  <!-- Auth terminal -->
  <div style="background:#000;border-radius:var(--radius-card);overflow:hidden;height:300px;margin-bottom:1rem;">
    <div id="xterm-auth-<%= it.id %>" style="width:100%;height:100%;"></div>
  </div>

  <!-- Status indicator — HTMX polls this every 2 seconds until credentials appear -->
  <div id="auth-status-indicator"
       hx-get="/api/model-configs/<%= it.id %>/auth/status?token=<%= it.token %>"
       hx-trigger="every 2s"
       hx-swap="outerHTML"
       style="margin-bottom:0.75rem;">
    <span class="badge badge--paused">Waiting for login…</span>
  </div>

  <button
    class="btn btn-ghost btn-sm"
    hx-delete="/api/model-configs/<%= it.id %>/auth/stop?token=<%= it.token %>"
    hx-swap="none"
    onclick="document.getElementById('form-panel').classList.remove('is-open')"
  >Cancel</button>
</div>

<script type="module">
  import { openTerminal } from '/js/terminal.js';

  // terminal.js expects a sessionId key for the openTerminals Map.
  // Use the auth token as the unique key so it doesn't collide with real sessions.
  const authKey = 'auth-<%= it.token %>';
  const containerId = 'xterm-auth-<%= it.id %>';

  // Override openTerminal to use /ws/auth/:token instead of /ws/terminal/:id
  (async function () {
    const container = document.getElementById(containerId);
    if (!container) return;

    const term = new window.Terminal({
      fontSize: 13,
      fontFamily: getComputedStyle(document.documentElement).getPropertyValue('--font-mono').trim() ||
        'ui-monospace, SFMono-Regular, Menlo, Consolas, monospace',
      theme: {
        background: '#000000',
        foreground: '#e2e8f0',
        cursor: '#2563eb',
      },
      cursorBlink: true,
    });

    const fitAddon = new window.FitAddon.FitAddon();
    term.loadAddon(fitAddon);
    term.open(container);
    fitAddon.fit();

    // Fetch one-time ticket for OIDC mode (no-op if auth=none)
    let ticket = '';
    try {
      const r = await fetch('/api/ws-ticket');
      if (r.ok) {
        const data = await r.json();
        ticket = typeof data.ticket === 'string' ? data.ticket : '';
      }
    } catch { /* proceed without ticket */ }

    const proto = location.protocol === 'https:' ? 'wss:' : 'ws:';
    const wsUrl = ticket
      ? `${proto}//${location.host}/ws/auth/<%= it.token %>?ticket=${ticket}`
      : `${proto}//${location.host}/ws/auth/<%= it.token %>`;
    const ws = new WebSocket(wsUrl);

    ws.onmessage = (event) => {
      try {
        const msg = JSON.parse(event.data);
        if (msg.type === 'output' && typeof msg.data === 'string') {
          term.write(msg.data);
        } else if (msg.type === 'error' && typeof msg.message === 'string') {
          term.write(`\r\n\x1b[31m[error] ${msg.message}\x1b[0m\r\n`);
        }
      } catch { /* ignore */ }
    };

    ws.onerror = () => {
      term.write('\r\n\x1b[31m[terminal] WebSocket connection failed\x1b[0m\r\n');
    };

    ws.onclose = (event) => {
      if (event.code !== 1000 && event.code !== 1001) {
        term.write(`\r\n\x1b[33m[terminal] Connection closed (code ${event.code})\x1b[0m\r\n`);
      }
    };

    term.onData((data) => {
      if (ws.readyState === WebSocket.OPEN) {
        ws.send(JSON.stringify({ type: 'input', data }));
      }
    });

    const observer = new ResizeObserver(() => {
      fitAddon.fit();
      if (ws.readyState === WebSocket.OPEN) {
        const dims = fitAddon.proposeDimensions();
        if (dims) {
          ws.send(JSON.stringify({ type: 'resize', cols: dims.cols, rows: dims.rows }));
        }
      }
    });
    observer.observe(container);

    // Clean up when the form panel closes
    document.getElementById('form-panel')?.addEventListener('transitionend', function onTransition() {
      if (!document.getElementById('form-panel').classList.contains('is-open')) {
        ws.close();
        term.dispose();
        observer.disconnect();
        document.getElementById('form-panel').removeEventListener('transitionend', onTransition);
      }
    });
  })();
</script>
