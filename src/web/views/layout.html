<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title><%= it.title ?? 'Orcha' %></title>
    <link rel="stylesheet" href="/css/tokens.css" />
    <link rel="stylesheet" href="/css/layout.css" />
    <link rel="stylesheet" href="/css/components.css" />
    <link rel="stylesheet" href="/vendor/xterm.css" />
    <link rel="modulepreload" href="/js/terminal.js" />
    <script src="/vendor/htmx.min.js" defer></script>
    <script src="/vendor/htmx-ext-sse.js" defer></script>
    <script src="/vendor/xterm.js"></script>
    <script src="/vendor/addon-fit.js"></script>
  </head>
  <body class="orcha-layout">
    <!-- Sidebar -->
    <aside class="orcha-sidebar">
      <a href="/" class="orcha-sidebar__logo">
        <svg
          width="22"
          height="22"
          viewBox="0 0 22 22"
          fill="none"
          aria-hidden="true"
          xmlns="http://www.w3.org/2000/svg"
        >
          <rect width="22" height="22" rx="5" fill="var(--color-accent)" />
          <path
            d="M5 8l3 3-3 3M11 15h6"
            stroke="#fff"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          />
        </svg>
        Orcha
      </a>

      <nav class="orcha-sidebar__nav" aria-label="Main navigation">
        <a
          href="/"
          class="orcha-sidebar__nav-item<%= it.activeNav === 'sessions' ? ' orcha-sidebar__nav-item--active' : '' %>"
        >
          <svg
            width="16"
            height="16"
            viewBox="0 0 16 16"
            fill="none"
            aria-hidden="true"
            xmlns="http://www.w3.org/2000/svg"
          >
            <rect
              x="1"
              y="1"
              width="6"
              height="6"
              rx="1.5"
              stroke="currentColor"
              stroke-width="1.5"
            />
            <rect
              x="9"
              y="1"
              width="6"
              height="6"
              rx="1.5"
              stroke="currentColor"
              stroke-width="1.5"
            />
            <rect
              x="1"
              y="9"
              width="6"
              height="6"
              rx="1.5"
              stroke="currentColor"
              stroke-width="1.5"
            />
            <rect
              x="9"
              y="9"
              width="6"
              height="6"
              rx="1.5"
              stroke="currentColor"
              stroke-width="1.5"
            />
          </svg>
          Sessions
        </a>

        <a
          href="/presets"
          class="orcha-sidebar__nav-item<%= it.activeNav === 'presets' ? ' orcha-sidebar__nav-item--active' : '' %>"
        >
          <svg
            width="16"
            height="16"
            viewBox="0 0 16 16"
            fill="none"
            aria-hidden="true"
            xmlns="http://www.w3.org/2000/svg"
          >
            <path
              d="M2 4h12M2 8h8M2 12h6"
              stroke="currentColor"
              stroke-width="1.5"
              stroke-linecap="round"
            />
          </svg>
          Presets
        </a>
      </nav>

      <div class="sidebar-section">
        <p class="sidebar-section__title">Presets</p>
        <div id="preset-list-slot"
          hx-get="/api/presets"
          hx-trigger="load"
          hx-swap="innerHTML">
        </div>
        <button class="btn btn-ghost btn-sm" style="width:100%;margin-top:0.5rem"
          hx-get="/api/presets/save-form"
          hx-target="#form-panel-slot"
          hx-swap="innerHTML"
          onclick="document.getElementById('form-panel').classList.add('is-open')">
          + Save Preset
        </button>
      </div>

      <div class="orcha-sidebar__footer">
        <span class="version-badge">v<%= it.version ?? '0.1.0' %></span>
      </div>
    </aside>

    <!-- Header -->
    <header class="orcha-header">
      <span class="orcha-header__title"><%= it.pageTitle ?? 'Sessions' %></span>
      <div class="orcha-header__actions">
        <%~ it.headerActions ?? '' %>
        <button
          class="btn btn-primary"
          hx-get="/api/sessions/new-form"
          hx-target="#form-panel-slot"
          hx-swap="innerHTML"
          onclick="document.getElementById('form-panel').classList.add('is-open')"
        >+ New Session</button>
      </div>
    </header>

    <!-- Main content -->
    <main class="orcha-main" id="main-content"><%~ it.body %></main>

    <!-- Slide-in form panel -->
    <div id="form-panel" class="form-panel">
      <div id="form-panel-slot"></div>
    </div>
  </body>
</html>
