<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title><%= it.title ?? 'Orcha' %></title>
    <!-- HTMX 2.x: swap 422 responses so validation errors are shown in forms -->
    <meta name="htmx-config" content='{"responseHandling":[{"code":"204","swap":false},{"code":"422","swap":true},{"code":"[45]..","swap":false,"error":true},{"code":"[23]..","swap":true},{"code":"[0-9][0-9][0-9]","swap":false,"error":true}]}' />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="/css/styles.css" />
    <link rel="stylesheet" href="/vendor/xterm.css" />
    <link rel="modulepreload" href="/js/terminal.js" />
    <script src="/vendor/htmx.min.js" defer></script>
    <script src="/vendor/htmx-ext-sse.js" defer></script>
    <script>if(!(window.SpeechRecognition||window.webkitSpeechRecognition))document.documentElement.classList.add('no-speech-api')</script>
    <script src="/vendor/xterm.js"></script>
    <script src="/vendor/addon-fit.js"></script>
    <script src="/vendor/addon-web-links.js"></script>
    <script src="/vendor/sortablejs.min.js" defer></script>
    <script src="/js/kanban-drag.js" defer></script>
    <script src="/js/kanban-sse.js" defer></script>
  </head>
  <body class="orcha-layout">
    <!-- Sidebar -->
    <aside class="orcha-sidebar">
      <a href="/" class="orcha-sidebar__logo">
        <svg
          width="22"
          height="22"
          viewBox="0 0 22 22"
          fill="none"
          aria-hidden="true"
          xmlns="http://www.w3.org/2000/svg"
        >
          <rect width="22" height="22" rx="5" fill="var(--color-accent)" />
          <path
            d="M5 8l3 3-3 3M11 15h6"
            stroke="#fff"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          />
        </svg>
        <span class="orcha-sidebar__logo-text">Orcha</span>
      </a>

      <nav class="orcha-sidebar__nav" aria-label="Main navigation">
        <a
          href="/"
          class="orcha-sidebar__nav-item<%= it.activeNav === 'sessions' ? ' orcha-sidebar__nav-item--active' : '' %>"
          title="Sessions"
        >
          <svg width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true">
            <rect x="1" y="1" width="6" height="6" rx="1.5" stroke="currentColor" stroke-width="1.5" />
            <rect x="9" y="1" width="6" height="6" rx="1.5" stroke="currentColor" stroke-width="1.5" />
            <rect x="1" y="9" width="6" height="6" rx="1.5" stroke="currentColor" stroke-width="1.5" />
            <rect x="9" y="9" width="6" height="6" rx="1.5" stroke="currentColor" stroke-width="1.5" />
          </svg>
          <span class="orcha-sidebar__nav-item-text">Sessions</span>
        </a>

        <a
          href="/tasks"
          class="orcha-sidebar__nav-item<%= it.activeNav === 'tasks' ? ' orcha-sidebar__nav-item--active' : '' %>"
          title="Tasks"
        >
          <svg width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true">
            <path d="M3 3h10v10H3z" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/>
            <path d="M5 7.5l2 2 4-4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
          <span class="orcha-sidebar__nav-item-text">Tasks</span>
        </a>

        <a
          href="/presets"
          class="orcha-sidebar__nav-item<%= it.activeNav === 'presets' ? ' orcha-sidebar__nav-item--active' : '' %>"
          title="Presets"
        >
          <svg width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true">
            <path d="M2 4h12M2 8h8M2 12h6" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" />
          </svg>
          <span class="orcha-sidebar__nav-item-text">Presets</span>
        </a>

        <a
          href="/repos"
          class="orcha-sidebar__nav-item<%= it.activeNav === 'repos' ? ' orcha-sidebar__nav-item--active' : '' %>"
          title="Repos"
        >
          <svg width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true">
            <path
              d="M13 14H3a1 1 0 01-1-1V3a1 1 0 011-1h7l3 3v8a1 1 0 01-1 1z"
              stroke="currentColor"
              stroke-width="1.5"
              stroke-linejoin="round"
            />
            <path d="M9 2v4h4" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round" />
          </svg>
          <span class="orcha-sidebar__nav-item-text">Repos</span>
        </a>

        <a
          href="/credentials"
          class="orcha-sidebar__nav-item<%= it.activeNav === 'credentials' ? ' orcha-sidebar__nav-item--active' : '' %>"
          title="Credentials"
        >
          <svg width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true">
            <circle cx="6" cy="7" r="3.5" stroke="currentColor" stroke-width="1.5" />
            <path d="M8.5 9.5L13 14M10.5 12l1.5 1.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" />
          </svg>
          <span class="orcha-sidebar__nav-item-text">Credentials</span>
        </a>

        <a
          href="/models"
          class="orcha-sidebar__nav-item<%= it.activeNav === 'models' ? ' orcha-sidebar__nav-item--active' : '' %>"
          title="Models"
        >
          <svg width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true">
            <path d="M8 1L14 4.5V11.5L8 15L2 11.5V4.5L8 1Z" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/>
            <path d="M8 8L14 4.5M8 8L2 4.5M8 8V15" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/>
          </svg>
          <span class="orcha-sidebar__nav-item-text">Models</span>
        </a>

        <a
          href="/settings"
          class="orcha-sidebar__nav-item<%= it.activeNav === 'settings' ? ' orcha-sidebar__nav-item--active' : '' %>"
          title="Settings"
        >
          <svg width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true">
            <circle cx="8" cy="8" r="2" stroke="currentColor" stroke-width="1.5" />
            <path
              d="M8 1.5v1M8 13.5v1M1.5 8h1M13.5 8h1M3.4 3.4l.7.7M11.9 11.9l.7.7M3.4 12.6l.7-.7M11.9 4.1l.7-.7"
              stroke="currentColor"
              stroke-width="1.5"
              stroke-linecap="round"
            />
          </svg>
          <span class="orcha-sidebar__nav-item-text">Settings</span>
        </a>

        <a
          href="/system"
          class="orcha-sidebar__nav-item<%= it.activeNav === 'system' ? ' orcha-sidebar__nav-item--active' : '' %>"
          title="System"
        >
          <svg width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true">
            <path
              d="M8 14s-5.5-3.5-6-7C1.5 3.5 4 2 5.5 2 6.8 2 7.6 2.8 8 3.5 8.4 2.8 9.2 2 10.5 2 12 2 14.5 3.5 14 7c-.5 3.5-6 7-6 7z"
              stroke="currentColor"
              stroke-width="1.5"
              stroke-linecap="round"
              stroke-linejoin="round"
            />
          </svg>
          <span class="orcha-sidebar__nav-item-text">System</span>
        </a>

        <div class="orcha-sidebar__divider"></div>

        <a
          href="/guide"
          class="orcha-sidebar__nav-item<%= it.activeNav === 'guide' ? ' orcha-sidebar__nav-item--active' : '' %>"
          title="Guide"
        >
          <svg width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true">
            <path d="M2 2h8l4 4v8a1 1 0 01-1 1H3a1 1 0 01-1-1V2z" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/>
            <path d="M5 9h6M5 12h4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
          </svg>
          <span class="orcha-sidebar__nav-item-text">Guide</span>
        </a>

        <a
          href="/about"
          class="orcha-sidebar__nav-item<%= it.activeNav === 'about' ? ' orcha-sidebar__nav-item--active' : '' %>"
          title="About"
        >
          <svg width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true">
            <circle cx="8" cy="8" r="6.5" stroke="currentColor" stroke-width="1.5"/>
            <path d="M8 7v4M8 5v.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
          </svg>
          <span class="orcha-sidebar__nav-item-text">About</span>
        </a>
      </nav>

      <div class="orcha-sidebar__footer">
        <span class="version-badge">v<%= it.version ?? '0.1.0' %><% if (it.commitSha) { %> · <%= it.commitSha.slice(0, 8) %><% } %></span>
        <button class="orcha-sidebar__toggle" id="sidebar-toggle" onclick="toggleSidebar()" aria-label="Toggle sidebar">
          <svg class="toggle-icon-collapse" width="14" height="14" viewBox="0 0 14 14" fill="none" aria-hidden="true">
            <path d="M9 2L5 7l4 5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
          <svg class="toggle-icon-expand" width="14" height="14" viewBox="0 0 14 14" fill="none" aria-hidden="true">
            <path d="M5 2l4 5-4 5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </button>
      </div>
    </aside>

    <!-- Header -->
    <header class="orcha-header">
      <span class="orcha-header__title"><%= it.pageTitle ?? 'Sessions' %></span>
      <div class="orcha-header__actions">
        <%~ it.headerActions ?? '' %>
      </div>
    </header>

    <!-- Main content -->
    <main class="orcha-main<%= it.activeNav === 'sessions' ? ' orcha-main--sessions' : '' %>" id="main-content"><%~ it.body %></main>

    <script>
      (function () {
        if (localStorage.getItem('sidebar-collapsed') === '1') {
          document.querySelector('.orcha-layout').classList.add('sidebar-collapsed');
        }
      })();
      function toggleSidebar() {
        var collapsed = document.querySelector('.orcha-layout').classList.toggle('sidebar-collapsed');
        localStorage.setItem('sidebar-collapsed', collapsed ? '1' : '0');
      }
      // HX-Trigger: close-panel fires on the form (before swap, still in DOM) and bubbles to body
      document.body.addEventListener('close-panel', function () {
        document.getElementById('form-panel').classList.remove('is-open');
      });
      // HX-Trigger-After-Swap: refresh-* fires on body (form is detached after swap)
      document.body.addEventListener('refresh-repo-list', function () {
        var el = document.getElementById('repo-list-slot');
        if (el) htmx.trigger(el, 'refresh');
      });
      document.body.addEventListener('refresh-preset-list', function () {
        var el = document.getElementById('preset-list-slot');
        if (el) htmx.trigger(el, 'refresh');
      });
      document.body.addEventListener('refresh-cred-list', function () {
        var el = document.getElementById('credential-profiles-slot');
        if (el) htmx.trigger(el, 'refresh');
      });
      document.body.addEventListener('refresh-model-list', function () {
        var el = document.getElementById('model-config-list-slot');
        if (el) htmx.trigger(el, 'refresh');
      });
      document.body.addEventListener('refresh-task-list', function () {
        var el = document.getElementById('task-list-slot');
        if (el) htmx.trigger(el, 'refresh');
      });
    </script>

    <!-- Toast notifications -->
    <div id="toast-container"></div>

    <!-- Slide-in form panel -->
    <div id="form-panel" class="form-panel">
      <div class="form-panel__header">
        <button
          class="form-panel__close"
          onclick="document.getElementById('form-panel').classList.remove('is-open')"
          aria-label="Close panel"
        >
          <svg width="14" height="14" viewBox="0 0 14 14" fill="none" aria-hidden="true">
            <path d="M2 2l10 10M12 2L2 12" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
          </svg>
        </button>
      </div>
      <div id="form-panel-slot"></div>
    </div>
  </body>
</html>
